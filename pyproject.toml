[project]
name = "munder-difflin"
version = "0.1.0"
description = "Office-themed multi-agent paper company"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=0.0.49",
    "pandas==2.2.3",
    "SQLAlchemy==2.0.40",
    "python-dotenv==1.1.0",
    "openai==1.76.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "anyio>=4.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
